id: individual_event

requirements:
  - name: ecoscope-platform
    version: ">=2.17.0,<3.0.0"
    channel: https://repo.prefix.dev/ecoscope-workflows/

  - name: ecoscope-workflows-ext-custom
    version: "0.1.1"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

  - name: pydeck
    version: 0.9.2
    channel: conda-forge

  - name: ecoscope-workflows-ext-apn
    version: "0.0.30"
    channel: https://repo.prefix.dev/ecoscope-workflows-custom/

rjsf-overrides:
  properties:
    processed_event_details.properties.map_to_titles.title: "Use Field Titles"
    processed_event_details.properties.map_to_titles.description: >-
      Set to true when the Jinja template references field titles (human-readable labels);
      set to false when it references raw field keys.
    serial_no.properties.var.title: "Event Serial Number"
    serial_no.properties.var.description: >-
      Enter the serial number of the event to retrieve (e.g. 1234).
    processed_event_details.title: "Process Event Details"
    "Report Generation.properties.get_template_path.properties.var.title": "Template File Path"
    "Report Generation.properties.get_template_path.properties.var.description": >-
      Path to the Word (.docx) report template file.
    "Report Generation.properties.download_attachments.properties.skip_download.title": "Skip Attachments"
    "Report Generation.properties.download_attachments.properties.skip_download.description": >-
      Set to true to skip downloading attachments.
    "Report Generation.properties.download_attachments.properties.skip_download.default": false
    Spatial Features.properties.spatial_features.properties.source.default:
      query: null
    Local Spatial Features.properties.local_spatial_file.properties.layer.default: ""
  $defs:
    EarthRangerSource:
      title: EarthRanger
      type: object
      properties:
        query:
          title: Query
          default: null
          anyOf:
            - type: "null"
              title: "--- select ---"
            - $ref: "#/$defs/FeatureSetQuery"
            - $ref: "#/$defs/FeatureTypeQuery"
            - $ref: "#/$defs/FeatureIdQuery"
  uiSchema:
    Spatial Features.spatial_features.source:
      ui:options:
        label: false
    Spatial Features.spatial_features.source.query:
      ui:options:
        label: false
    Spatial Features.spatial_features.source.query.anyOf:
      - ui:options:
          label: false
      - ui:options:
          label: false
      - ui:options:
          label: false
    Spatial Features.spatial_features.legend_title:
      ui:placeholder: "e.g. Park Boundary"

task-instance-defaults:
  skipif:
    conditions:
      - any_is_empty_df
      - any_dependency_skipped

workflow:
  - name: Set Workflow Details
    id: workflow_details
    task: set_workflow_details

  - name: Data Source
    id: er_client
    task: set_er_connection

  - id: user_details
    task: get_user_me
    partial:
      client: ${{ workflow.er_client.return }}

  - name: Define Base Maps
    id: base_maps
    task: set_base_maps

  - name: Get Event Serial No.
    id: serial_no
    task: set_string_var

  - name: Set Locale
    id: locale
    task: set_locale
    partial:
      locale_str: es_ES

  - name: Time Range
    id: time_range
    task: set_time_range
    partial:
      time_format: "%d %b %Y %H:%M:%S"

  - id: get_timezone
    task: get_timezone_from_time_range
    partial:
      time_range: ${{ workflow.time_range.return }}

  - name: All Events
    id: events
    task: get_events
    partial:
      client: ${{ workflow.er_client.return }}
      time_range: ${{ workflow.time_range.return }}
      event_columns:
        - id
        - time
        - priority_label
        - event_type
        - location
        - event_category
        - reported_by
        - serial_number
        - geometry
        - event_details
      event_types: []
      include_details: true
      raise_on_empty: false
      include_updates: false
      include_display_values: true
      include_related_events: false
      include_null_geometry: false

  - id: convert_events_to_user_tz
    task: convert_values_to_timezone
    partial:
      df: ${{ workflow.events.return }}
      timezone: ${{ workflow.get_timezone.return }}
      columns:
        - time

  - name: Convert Serial Number to String
    id: convert_serial_no
    task: convert_column_values_to_string
    partial:
      df: ${{ workflow.convert_events_to_user_tz.return }}
      columns:
        - serial_number

  - name: Get Event by Serial Number
    id: get_event
    task: filter_df
    partial:
      df: ${{ workflow.convert_serial_no.return }}
      column_name: "serial_number"
      op: "equal"
      value: ${{ workflow.serial_no.return }}
      reset_index: false

  - id: processed_event_details
    task: process_events_details
    partial:
      df: ${{ workflow.get_event.return }}
      client: ${{ workflow.er_client.return }}
      ordered: true

  - id: select_event_details
    task: select_columns
    partial:
      df: ${{ workflow.processed_event_details.return }}
      raise_on_missing: false
      columns:
        - event_details

  - id: event_details_list
    task: dataframe_to_dict
    partial:
      df: ${{ workflow.select_event_details.return }}
      orient: records
      drop_geometry: true

  - id: event_details
    task: get_collection_item
    partial:
      key: [0, "event_details"]
      collection: ${{ workflow.event_details_list.return }}
      default: null
      raise_on_missing: true

  - name: Get Event Location
    id: get_event_location
    task: get_first_row_value
    partial:
      gdf: ${{ workflow.get_event.return }}
      field_name: location

  - title: Spatial Features
    type: task-group
    description: "Fetch spatial features from EarthRanger and render them as a map layer."
    tasks:
      - id: spatial_features
        task: get_spatial_features
        partial:
          client: ${{ workflow.er_client.return }}

      - id: spatial_features_layer
        task: create_spatial_features_layer
        partial:
          geodataframe: ${{ workflow.spatial_features.return }}
          tooltip_columns: null

  - title: Local Spatial Features
    type: task-group
    description: "Load spatial features from a local file and render them as a map layer."
    tasks:
      - id: local_spatial_file
        task: load_local_spatial_file

      - id: local_spatial_features_layer
        task: create_spatial_features_layer
        partial:
          geodataframe: ${{ workflow.local_spatial_file.return }}
          tooltip_columns: null

  - title: Event Scatterplot Map
    type: task-group
    description: Create a scatterplot map of events.
    tasks:
      - name: Apply Colormap to Event Type
        id: event_type_colormap
        task: apply_color_map
        partial:
          df: ${{ workflow.get_event.return }}
          input_column_name: event_type_display
          output_column_name: event_type_color
          colormap: Set3

      - id: event_scatterplot_layer
        task: create_scatterplot_layer
        partial:
          geodataframe: ${{ workflow.event_type_colormap.return }}
          layer_style:
            auto_highlight: false
            opacity: 1.0
            get_fill_color: event_type_color
            radius_min_pixels: 15
          data_url: null
          legend:
            label_column: event_type_display
            color_column: event_type_color

      # collect_optional_layers requires ecoscope-workflows-ext-apn >= 0.0.26,
      # which is not yet published to the channel. Bump the version in requirements
      # and pixi.toml once 0.0.26 is available and recompile.
      - id: optional_geo_layers
        task: collect_optional_layers
        skipif:
          conditions:
            - never
        partial:
          layers:
            - ${{ workflow.spatial_features_layer.return }}
            - ${{ workflow.local_spatial_features_layer.return }}
            - ${{ workflow.event_scatterplot_layer.return }}

      - id: event_map_view_state
        task: view_state_from_layers
        partial:
          layers:
            - ${{ workflow.event_scatterplot_layer.return }}

      - name: Draw Event Map
        id: event_map
        task: draw_map
        partial:
          geo_layers: ${{ workflow.optional_geo_layers.return }}
          tile_layers: ${{ workflow.base_maps.return }}
          static: false
          output_type: html
          title: null
          max_zoom: 15
          view_state: ${{ workflow.event_map_view_state.return }}
          legend_style:
            placement: bottom-right

      - name: Persist Event Map HTML
        id: persist_event_map_html
        task: persist_text
        partial:
          root_path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          filename_suffix: event_map
          text: ${{ workflow.event_map.return }}

      - name: Convert HTML Event Map to PNG
        id: event_map_to_png
        task: html_to_png
        partial:
          html_path: ${{ workflow.persist_event_map_html.return }}
          output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          config:
            full_page: false

      - name: Create Map Widget for Event Map
        id: event_map_widget
        task: create_map_widget_single_view
        skipif:
          conditions:
            - never
        partial:
          title: "Event Scatterplot Map"
          data: ${{ workflow.persist_event_map_html.return }}

  # Events Notes & Attachments
  - id: event_notes
    task: get_eventnotes
    partial:
      event: ${{ workflow.get_event.return }}
      client: ${{ workflow.er_client.return }}
      use_index_as_id: false

  - id: event_subset
    task: select_columns
    partial:
      df: ${{ workflow.get_event.return }}
      raise_on_missing: false
      columns:
        - id
        - serial_number
        - event_type_display

  - id: eventnotes_add_event_serial_no
    task: merge_two_dataframes
    partial:
      left: ${{ workflow.event_notes.return }}
      right: ${{ workflow.event_subset.return }}
      on: null
      how: "left"
      left_on: event
      right_on: id
      left_index: false
      right_index: false
      fillna_value: null

  - id: safe_notes
    task: ensure_dataframe
    skipif:
      conditions:
        - never
    partial:
      df: ${{ workflow.eventnotes_add_event_serial_no.return }}

  - title: Report Generation
    type: task-group
    description: Generate the event report including attachments.
    tasks:
      - name: Add Lat/Lon to Events
        id: add_lat_lon_to_events
        task: add_lat_lon_to_gdf
        partial:
          event_gdf: ${{ workflow.get_event.return }}

      - id: get_template_path
        task: set_string_var

      - name: Download Attachments
        id: download_attachments
        task: download_event_attachments
        partial:
          client: ${{ workflow.er_client.return }}
          event_gdf: ${{ workflow.add_lat_lon_to_events.return }}
          output_dir: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}
          use_index_as_id: false
          attachments_subdir: attachments

      - name: Filtered Event
        id: filtered_event
        task: map_columns
        partial:
          df: ${{ workflow.add_lat_lon_to_events.return }}
          drop_columns: null
          retain_columns:
            - id
            - time
            - location
            - priority_label
            - event_type
            - serial_number
            - event_type_display
            - event_category
            - reported_by
            - lat/lon
          rename_columns: null
          raise_if_not_found: True
          duplicate_strategy: suffix

      - id: norm_template_path
        task: remove_file_scheme
        partial:
          path: ${{ workflow.get_template_path.return }}

      - id: norm_output_dir
        task: remove_file_scheme
        partial:
          path: ${{ env.ECOSCOPE_WORKFLOWS_RESULTS }}

      - name: Generate Event Report
        id: generate_docx
        task: generate_event_report
        partial:
          event: ${{ workflow.filtered_event.return }}
          event_details: ${{ workflow.event_details.return }}
          event_map_path: ${{ workflow.event_map_to_png.return }}
          event_location: ${{ workflow.get_event_location.return }}
          notes: ${{ workflow.safe_notes.return }}
          user_details: ${{ workflow.user_details.return }}
          attachments: ${{ workflow.download_attachments.return }}
          include_attachment: true
          template_path: ${{ workflow.norm_template_path.return }}
          output_dir: ${{ workflow.norm_output_dir.return }}

  - name: Create Dashboard
    id: dashboard
    task: gather_dashboard
    partial:
      details: ${{ workflow.workflow_details.return}}
      widgets:
        - ${{ workflow.event_map_widget.return }}
      time_range: ${{ workflow.time_range.return}}
